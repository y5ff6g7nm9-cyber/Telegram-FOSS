name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set API keys
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          sed -i -E "s/APP_ID = [0-9]+;/APP_ID = $API_ID;/" $F
          sed -i -E "s/APP_HASH = \"[0-9a-f]*\";/APP_HASH = \"$API_HASH\";/" $F
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - run: chmod +x gradlew
      - run: ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/*.apk"
